name: juice_shop_scanner
on:
  push:
    branches:
      - ci-modified
jobs:
  build-and-scan:
    runs-on: windows-latest

    defaults:
      run:
        shell: bash
    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.3.1'

      # 3. Install Juice Shop dependencies
      - name: Install Juice Shop dependencies
        run: npm install

      # 4. Start Juice Shop app
      - name: Start Juice Shop app
        run: |
          npm start &
          sleep 15

      # 5. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.7'

      # 6. Install Python dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 7. Run SQL Injection detector
      - name: Run SQL Injection detector
        run: python juice-shop/security-scripts/log_analysis.py logs/juice_logs_combined.csv

     